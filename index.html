<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FIXORIUM | HOME</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0A0A0F 0%, #13131F 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* PARTICLE CANVAS BACKGROUND */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* FIXED HEADER BAR */
    .header-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1.2rem 2rem;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* DESKTOP MENU */
    .desktop-menu {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .header-link {
      font-size: 16px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .header-link:hover {
      color: rgba(255, 255, 255, 1);
    }

    /* MOBILE MENU BUTTON */
    .mobile-menu-btn {
      display: none;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 24px;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
    }

    /* MOBILE DROPDOWN OVERLAY */
    .mobile-dropdown {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 15, 0.98);
      backdrop-filter: blur(20px);
      z-index: 200;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-left: 2rem;
      gap: 1rem;
    }

    .mobile-dropdown.open {
      display: flex;
    }

    .mobile-dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.8rem 2rem;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .mobile-dropdown-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .dropdown-icon {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.5);
    }

    .close-dropdown {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 24px;
      width: 44px;
      height: 44px;
      border-radius: 44px;
      cursor: pointer;
    }

    /* MAIN CONTENT - CENTERED */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      width: 100%;
      padding: 2rem;
    }

    /* PREMIUM FIXORIUM TEXT */
    .fixorium-header {
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFFFFF 0%, #B8B8C8 50%, #FFFFFF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    /* MODERN BORDER LINE */
    .border-line {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.6), rgba(0, 212, 255, 0.6), transparent);
      margin: 1.5rem auto;
      border-radius: 2px;
    }

    /* SUBTITLE */
    .decentralized-sub {
      font-size: clamp(0.7rem, 2.5vw, 0.85rem);
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      font-weight: 400;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      .desktop-menu {
        display: none;
      }
      .mobile-menu-btn {
        display: block;
      }
      .header-bar {
        padding: 1rem 1.5rem;
      }
      .center-text {
        padding: 2rem;
      }
    }

    @media (min-width: 769px) {
      .mobile-dropdown {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>

  <!-- FIXED HEADER BAR -->
  <div class="header-bar">
    <!-- DESKTOP MENU -->
    <div class="desktop-menu">
      <a href="dex-service.html" class="header-link">DEX SERVICE</a>
      <a href="exchange.html" class="header-link">EXCHANGE</a>
      <a href="wallet.html" class="header-link">WALLET</a>
      <a href="team.html" class="header-link">TEAM</a>
      <a href="docs.html" class="header-link">DOCS</a>
    </div>

    <!-- MOBILE MENU BUTTON -->
    <div style="flex: 1;"></div>
    <div class="mobile-menu-btn" id="mobileMenuBtn">☰</div>
  </div>

  <!-- MOBILE DROPDOWN MENU -->
  <div class="mobile-dropdown" id="mobileDropdown">
    <button class="close-dropdown" id="closeDropdownBtn">✕</button>
    <a href="dex-service.html" class="mobile-dropdown-item"><span class="dropdown-icon">★</span> DEX SERVICE</a>
    <a href="exchange.html" class="mobile-dropdown-item"><span class="dropdown-icon">★</span> EXCHANGE</a>
    <a href="wallet.html" class="mobile-dropdown-item"><span class="dropdown-icon">★</span> WALLET</a>
    <a href="team.html" class="mobile-dropdown-item"><span class="dropdown-icon">★</span> TEAM</a>
    <a href="docs.html" class="mobile-dropdown-item"><span class="dropdown-icon">★</span> DOCS</a>
  </div>

  <div class="center-text">
    <div class="fixorium-header">FIXORIUM</div>
    <div class="border-line"></div>
    <div class="decentralized-sub">DECENTRALIZED FINANCE</div>
  </div>

  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    let particles = [];
    
    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    const PARTICLE_COUNT = 100;
    const MAX_SPEED = 0.5;
    const MIN_RADIUS = 1;
    const MAX_RADIUS = 2;
    
    const colors = [
      'rgba(255, 255, 255, 0.2)',
      'rgba(255, 255, 255, 0.12)',
      'rgba(0, 212, 255, 0.15)',
      'rgba(200, 200, 220, 0.12)'
    ];
    
    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * (MAX_RADIUS - MIN_RADIUS) + MIN_RADIUS;
        this.speedX = (Math.random() - 0.5) * MAX_SPEED;
        this.speedY = (Math.random() - 0.5) * MAX_SPEED;
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        
        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height;
        if (this.y > height) this.y = 0;
      }
      
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }
    
    function drawConnections() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          if (distance < 100) {
            const opacity = (1 - distance / 100) * 0.06;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(0, 212, 255, ${opacity})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
    }
    
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new Particle());
    }
    
    let mouseX = null;
    let mouseY = null;
    
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      
      for (let p of particles) {
        const dx = p.x - mouseX;
        const dy = p.y - mouseY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < 100) {
          const angle = Math.atan2(dy, dx);
          const force = (100 - distance) / 100 * 1;
          p.x += Math.cos(angle) * force;
          p.y += Math.sin(angle) * force;
        }
      }
      
      setTimeout(() => {
        mouseX = null;
        mouseY = null;
      }, 50);
    });
    
    function animate() {
      ctx.clearRect(0, 0, width, height);
      
      for (let p of particles) {
        p.update();
        p.draw();
      }
      
      drawConnections();
      requestAnimationFrame(animate);
    }
    
    animate();

    // Mobile dropdown functionality
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileDropdown = document.getElementById('mobileDropdown');
    const closeDropdownBtn = document.getElementById('closeDropdownBtn');

    mobileMenuBtn.addEventListener('click', () => {
      mobileDropdown.classList.add('open');
    });

    function closeDropdown() {
      mobileDropdown.classList.remove('open');
    }

    closeDropdownBtn.addEventListener('click', closeDropdown);
    mobileDropdown.addEventListener('click', (e) => {
      if (e.target === mobileDropdown) {
        closeDropdown();
      }
    });
  </script>
</body>
</html>
