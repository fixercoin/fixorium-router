name: Refresh Pools
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh KV cache
        run: |
          curl -X GET https://fixorium.com.pk/api/max/v1/refresh \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
