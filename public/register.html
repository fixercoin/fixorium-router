<!DOCTYPE html>
<html>
<head>
    <title>MAX ROUTER - REGISTER</title>
    <style>
        body{background:#0a0a0a;font-family:monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .card{background:#001a1a;border:1px solid #0fc;border-radius:16px;padding:40px;max-width:450px;width:100%}
        h1{color:#0fc;text-align:center;margin-bottom:10px}
        h2{color:#0fc;text-align:center;font-size:14px;margin-bottom:20px}
        input{width:100%;background:#0a0a0a;border:1px solid #0fc;padding:12px;color:#0fc;border-radius:8px;margin:10px 0;box-sizing:border-box}
        button{width:100%;background:#0fc;border:none;padding:12px;color:#000;font-weight:bold;border-radius:8px;cursor:pointer;margin:10px 0;box-sizing:border-box}
        button:disabled{opacity:0.5;cursor:not-allowed}
        .result{background:#0a0a0a;padding:15px;border-radius:8px;margin-top:20px;display:none}
        .key{color:#0fc;word-break:break-all;font-size:11px;margin:5px 0}
        .error{color:#f36;text-align:center;margin-top:10px;font-size:11px;display:none}
        a{color:#0fc;text-decoration:none;display:block;text-align:center;margin-top:15px}
        .loading{display:inline-block;width:12px;height:12px;border:2px solid #000;border-top-color:#0fc;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div class="card">
    <h1>MAX ROUTER</h1>
    <h2>REGISTER</h2>
    
    <input type="email" id="email" placeholder="EMAIL">
    <input type="text" id="project" placeholder="PROJECT NAME">
    
    <button id="registerBtn">REGISTER</button>
    
    <div id="error" class="error"></div>
    <div id="result" class="result">
        <div class="key">API KEY: <span id="apiKey"></span></div>
        <div class="key">SECRET: <span id="secretKey"></span></div>
        <p style="color:#f36;font-size:10px;margin-top:10px">⚠️ SAVE YOUR SECRET KEY</p>
        <button id="copyBtn" style="margin-top:10px;background:#0fc20;color:#0fc;border:1px solid #0fc">COPY KEYS</button>
    </div>
    
    <a href="/dashboard">← BACK TO DASHBOARD</a>
</div>

<script>
    // Wait for page to load
    document.addEventListener('DOMContentLoaded', function() {
        const registerBtn = document.getElementById('registerBtn');
        if (registerBtn) {
            registerBtn.addEventListener('click', register);
        }
        
        const copyBtn = document.getElementById('copyBtn');
        if (copyBtn) {
            copyBtn.addEventListener('click', copyKeys);
        }
    });

    let lastApiKey = '';
    let lastSecretKey = '';

    async function register() {
        const email = document.getElementById('email').value.trim();
        const project = document.getElementById('project').value.trim();
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const registerBtn = document.getElementById('registerBtn');

        if (!email || !project) {
            errorDiv.innerText = 'FILL ALL FIELDS';
            errorDiv.style.display = 'block';
            setTimeout(() => { errorDiv.style.display = 'none'; }, 3000);
            return;
        }

        errorDiv.style.display = 'none';
        registerBtn.disabled = true;
        registerBtn.innerHTML = '<span class="loading"></span> REGISTERING...';

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, projectName: project })
            });

            const data = await response.json();

            if (data.success) {
                lastApiKey = data.apiKey;
                lastSecretKey = data.secretKey;
                
                document.getElementById('apiKey').innerText = data.apiKey;
                document.getElementById('secretKey').innerText = data.secretKey;
                resultDiv.style.display = 'block';
                
                document.getElementById('email').value = '';
                document.getElementById('project').value = '';
                
                registerBtn.innerHTML = 'REGISTERED!';
                
                localStorage.setItem('max_api_key', data.apiKey);
                
                // Auto copy to clipboard
                await navigator.clipboard.writeText('API KEY: ' + data.apiKey + '\nSECRET KEY: ' + data.secretKey);
                
                // Redirect to dashboard after 3 seconds
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 3000);
            } else {
                errorDiv.innerText = data.error || 'REGISTRATION FAILED';
                errorDiv.style.display = 'block';
                registerBtn.innerHTML = 'REGISTER';
            }
        } catch (err) {
            console.error('Error:', err);
            errorDiv.innerText = 'CONNECTION FAILED. TRY AGAIN.';
            errorDiv.style.display = 'block';
            registerBtn.innerHTML = 'REGISTER';
        } finally {
            registerBtn.disabled = false;
            setTimeout(() => {
                if (registerBtn.innerHTML !== 'REGISTER') {
                    registerBtn.innerHTML = 'REGISTER';
                }
            }, 3000);
        }
    }

    function copyKeys() {
        if (lastApiKey && lastSecretKey) {
            const text = 'API KEY: ' + lastApiKey + '\nSECRET KEY: ' + lastSecretKey;
            navigator.clipboard.writeText(text);
            alert('KEYS COPIED!');
        }
    }

    // Check for saved API key
    const savedKey = localStorage.getItem('max_api_key');
    if (savedKey) {
        document.getElementById('apiKey').innerText = savedKey;
        document.getElementById('result').style.display = 'block';
    }
</script>
</body>
</html>
