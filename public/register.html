<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX ROUTER - REGISTER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #001a1a;
            border: 1px solid #00ffcc;
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #00ffcc; text-align: center; margin-bottom: 10px; }
        h2 { color: #00ffcc; text-align: center; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #00ffcc;
            padding: 12px;
            color: #00ffcc;
            border-radius: 8px;
            margin: 10px 0;
            font-family: monospace;
        }
        button {
            width: 100%;
            background: #00ffcc;
            border: none;
            padding: 12px;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            font-family: monospace;
        }
        button:hover { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .key {
            color: #00ffcc;
            word-break: break-all;
            font-size: 11px;
            margin: 5px 0;
        }
        .label { color: #ff3366; font-size: 10px; margin-top: 10px; }
        a { color: #00ffcc; text-decoration: none; display: block; text-align: center; margin-top: 15px; font-size: 12px; }
        .error { color: #ff3366; text-align: center; margin-top: 10px; font-size: 11px; display: none; }
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #000;
            border-top-color: #00ffcc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>MAX ROUTER</h1>
        <h2>REGISTER</h2>
        
        <input type="email" id="email" placeholder="EMAIL" autocomplete="off">
        <input type="text" id="project" placeholder="PROJECT NAME" autocomplete="off">
        
        <button id="registerBtn" onclick="register()">REGISTER</button>
        
        <div id="error" class="error"></div>
        <div id="result" class="result">
            <div class="label">🔑 API KEY</div>
            <div class="key" id="apiKey"></div>
            <div class="label">🔒 SECRET KEY</div>
            <div class="key" id="secretKey"></div>
            <div class="label">⚠️ SAVE YOUR SECRET KEY</div>
            <button onclick="copyKeys()" style="margin-top: 10px; background: #00ffcc20; color:#00ffcc">COPY KEYS</button>
            <a href="/dashboard">→ GO TO DASHBOARD</a>
        </div>
        
        <a href="/dashboard">← BACK TO DASHBOARD</a>
    </div>

    <script>
        let registeredApiKey = null;
        let registeredSecretKey = null;

        async function register() {
            const email = document.getElementById('email').value.trim();
            const project = document.getElementById('project').value.trim();
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const registerBtn = document.getElementById('registerBtn');

            if (!email || !project) {
                errorDiv.innerText = 'PLEASE FILL ALL FIELDS';
                errorDiv.style.display = 'block';
                setTimeout(() => { errorDiv.style.display = 'none'; }, 3000);
                return;
            }

            errorDiv.style.display = 'none';
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="loading"></span> REGISTERING...';

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, projectName: project })
                });

                const data = await response.json();

                if (data.success) {
                    registeredApiKey = data.apiKey;
                    registeredSecretKey = data.secretKey;
                    
                    document.getElementById('apiKey').innerText = data.apiKey;
                    document.getElementById('secretKey').innerText = data.secretKey;
                    resultDiv.style.display = 'block';
                    
                    // Clear form
                    document.getElementById('email').value = '';
                    document.getElementById('project').value = '';
                    
                    registerBtn.innerHTML = 'REGISTERED!';
                    
                    // Save to localStorage
                    localStorage.setItem('max_api_key', data.apiKey);
                    
                    // Auto copy to clipboard
                    await navigator.clipboard.writeText(`API KEY: ${data.apiKey}\nSECRET KEY: ${data.secretKey}`);
                    
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 3000);
                } else {
                    errorDiv.innerText = data.error || 'REGISTRATION FAILED';
                    errorDiv.style.display = 'block';
                    registerBtn.innerHTML = 'REGISTER';
                }
            } catch (err) {
                console.error('Registration error:', err);
                errorDiv.innerText = 'CONNECTION FAILED. PLEASE TRY AGAIN.';
                errorDiv.style.display = 'block';
                registerBtn.innerHTML = 'REGISTER';
            } finally {
                registerBtn.disabled = false;
                setTimeout(() => {
                    if (registerBtn.innerHTML !== 'REGISTER') {
                        registerBtn.innerHTML = 'REGISTER';
                    }
                }, 3000);
            }
        }

        function copyKeys() {
            if (registeredApiKey && registeredSecretKey) {
                const text = `API KEY: ${registeredApiKey}\nSECRET KEY: ${registeredSecretKey}`;
                navigator.clipboard.writeText(text);
                alert('KEYS COPIED TO CLIPBOARD!');
            }
        }

        // Check if already has API key
        const savedKey = localStorage.getItem('max_api_key');
        if (savedKey) {
            document.getElementById('apiKey').innerText = savedKey;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
